<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ヘルパゴス</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Kaku Gothic Pro', 'Meiryo', sans-serif;
      background: linear-gradient(160deg, #0d2b45 0%, #1a4a6b 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
      gap: 14px;
    }

    h1 { font-size: 2em; color: #ffd700; letter-spacing: 0.05em; }
    .subtitle { color: #87ceeb; font-size: 0.85em; }

    /* ── Resources ── */
    .resources {
      display: flex;
      gap: 20px;
      background: rgba(0,0,0,0.35);
      padding: 14px 28px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .resource { text-align: center; }
    .resource .icon  { font-size: 1.8em; }
    .resource .label { font-size: 0.72em; color: #aaa; margin-top: 2px; }
    .resource .value {
      font-size: 1.8em;
      font-weight: bold;
      transition: color 0.3s;
    }
    .value.danger { color: #ff6b6b; }
    .value.ok     { color: #69ff99; }

    /* ── Weather card ── */
    .weather-area {
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
      padding: 14px 28px;
      border: 1px solid rgba(255,255,255,0.1);
      text-align: center;
      width: 100%;
      max-width: 480px;
    }
    .weather-area .section-label {
      font-size: 0.75em;
      color: #aaa;
      margin-bottom: 6px;
    }
    .weather-card-display {
      font-size: 2.4em;
      min-height: 1.2em;
    }
    .weather-desc {
      font-size: 0.85em;
      color: #87ceeb;
      margin-top: 4px;
    }
    .flip-btn {
      margin-top: 10px;
      padding: 8px 24px;
      font-size: 0.9em;
      background: #ffd700;
      color: #1a2a00;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
    }
    .flip-btn:hover { background: #ffe44d; }
    .flip-btn:disabled {
      background: #555;
      color: #888;
      cursor: default;
    }

    /* ── Players ── */
    .players { display: flex; gap: 10px; }
    .player-card {
      padding: 7px 16px;
      border-radius: 8px;
      background: rgba(255,255,255,0.08);
      border: 2px solid transparent;
      font-size: 0.88em;
      transition: all 0.2s;
      text-align: center;
    }
    .player-card.active {
      border-color: #ffd700;
      background: rgba(255,215,0,0.15);
      font-weight: bold;
    }
    .player-card .leader-badge {
      font-size: 0.7em;
      display: block;
      color: #ffd700;
      min-height: 1em;
    }

    /* ── Turn info ── */
    .turn-info {
      background: rgba(0,0,0,0.25);
      border-radius: 10px;
      padding: 10px 24px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .round-label       { font-size: 0.82em; color: #ffd700; }
    .current-player-label { font-size: 1.2em; font-weight: bold; margin-top: 2px; }
    .escape-hint       { font-size: 0.72em; color: #aaa; margin-top: 5px; }

    /* ── Actions ── */
    .actions { display: flex; gap: 12px; }
    .action-btn {
      padding: 12px 18px;
      font-size: 0.9em;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
      line-height: 1.5;
      transition: transform 0.1s, box-shadow 0.1s, opacity 0.2s;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
    .action-btn:hover:not(:disabled) { transform: translateY(-3px); }
    .action-btn:disabled { opacity: 0.4; cursor: default; box-shadow: none; }
    .action-btn small { display: block; font-weight: normal; font-size: 0.78em; opacity: 0.85; }
    .btn-fish  { background: #2196f3; color: #fff; }
    .btn-water { background: #00bcd4; color: #fff; }
    .btn-log   { background: #8bc34a; color: #1a2a00; }

    /* ── Log ── */
    .log {
      background: rgba(0,0,0,0.3);
      border-radius: 10px;
      padding: 10px 14px;
      width: 100%;
      max-width: 520px;
      max-height: 170px;
      overflow-y: auto;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .log-entry {
      padding: 3px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 0.86em;
      line-height: 1.4;
    }
    .log-entry:last-child { border-bottom: none; }
    .log-entry.round-end { color: #ffd700; }
    .log-entry.danger    { color: #ff6b6b; }
    .log-entry.weather   { color: #87ceeb; }

    /* ── Overlay ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.82);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .overlay-box {
      background: #0d2b45;
      border: 3px solid #ffd700;
      border-radius: 16px;
      padding: 32px 44px;
      text-align: center;
      max-width: 360px;
    }
    .overlay-box h2 { font-size: 2em; margin-bottom: 10px; }
    .overlay-box p  { color: #ccc; margin-bottom: 22px; line-height: 1.6; }
    .restart-btn {
      padding: 10px 32px;
      font-size: 1em;
      background: #ffd700;
      color: #1a2a00;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-family: inherit;
    }
    .restart-btn:hover { background: #ffe44d; }
  </style>
</head>
<body>

  <h1>🏝️ ヘルパゴス</h1>
  <p class="subtitle">無人島からの脱出を目指せ！</p>

  <!-- Resources -->
  <div class="resources">
    <div class="resource">
      <div class="icon">🐟</div>
      <div class="label">食料</div>
      <div class="value" id="food">0</div>
    </div>
    <div class="resource">
      <div class="icon">💧</div>
      <div class="label">水</div>
      <div class="value" id="water">0</div>
    </div>
    <div class="resource">
      <div class="icon">🪵</div>
      <div class="label">いかだ</div>
      <div class="value" id="raft">0</div>
    </div>
  </div>

  <!-- Weather card -->
  <div class="weather-area">
    <div class="section-label">天候カード</div>
    <div class="weather-card-display" id="weather-icon">──</div>
    <div class="weather-desc" id="weather-desc">リーダーがカードをめくってください</div>
    <button class="flip-btn" id="flip-btn" onclick="flipWeather()">🂠 カードをめくる</button>
  </div>

  <!-- Players -->
  <div class="players" id="players">
    <div class="player-card" data-idx="0"><span class="leader-badge" id="badge-0"></span>プレイヤー1</div>
    <div class="player-card" data-idx="1"><span class="leader-badge" id="badge-1"></span>プレイヤー2</div>
    <div class="player-card" data-idx="2"><span class="leader-badge" id="badge-2"></span>プレイヤー3</div>
  </div>

  <!-- Turn info -->
  <div class="turn-info">
    <div class="round-label">ラウンド <span id="round">1</span></div>
    <div class="current-player-label" id="phase-msg">リーダーが天候カードをめくるのを待っています</div>
    <div class="escape-hint">脱出条件: 食料・水・いかだ が各 3 以上</div>
  </div>

  <!-- Actions -->
  <div class="actions">
    <button class="action-btn btn-fish"  id="btn-fish"  onclick="doAction('fish')"  disabled>🐟 釣り<small>食料 +1〜3</small></button>
    <button class="action-btn btn-water" id="btn-water" onclick="doAction('water')" disabled>💧 水汲み<small id="water-hint">雨量: ?</small></button>
    <button class="action-btn btn-log"   id="btn-log"   onclick="doAction('log')"   disabled>🪵 伐採<small>いかだ +1〜2</small></button>
  </div>

  <!-- Log -->
  <div class="log" id="log">
    <div class="log-entry">ゲーム開始！ 3人で力を合わせて脱出しよう。</div>
  </div>

  <!-- Game End Overlay -->
  <div class="overlay" id="overlay" style="display:none">
    <div class="overlay-box">
      <h2 id="ov-title"></h2>
      <p  id="ov-msg"></p>
      <button class="restart-btn" onclick="restartGame()">もう一度プレイ</button>
    </div>
  </div>

  <!-- Feature modules -->
  <script src="features/leader/leader.js"></script>
  <script src="features/weather/weather.js"></script>
  <script src="features/water/water.js"></script>
  <script src="features/food/food.js"></script>
  <script src="features/raft/raft.js"></script>

  <script>
    const PLAYERS = 3;

    // ゲーム状態
    const G = {
      food: 0, water: 0, raft: 0,
      round: 1,
      phase: 'weather',   // 'weather' | 'action' | 'ended'
      turnOrder: [],       // このラウンドのターン順 (プレイヤーインデックス配列)
      turnIndex: 0,        // turnOrder 内の現在位置
    };

    function currentPlayerIdx() {
      return G.turnOrder[G.turnIndex];
    }
    function pname(i) { return 'プレイヤー' + (i + 1); }

    // ── 天候カードをめくる ──
    function flipWeather() {
      const rain = Weather.draw();
      const label = Weather.getLabel();

      document.getElementById('weather-icon').textContent = label.icon + ' ' + label.text;
      document.getElementById('weather-desc').textContent = label.desc;
      document.getElementById('flip-btn').disabled = true;
      document.getElementById('water-hint').textContent =
        rain === 0 ? '雨なし (0)' : '雨量: ' + rain;

      addLog(
        'リーダー ' + Leader.name() + ' が天候カードをめくった → ' +
        label.icon + ' ' + label.text + ' (' + label.desc + ')',
        'weather'
      );

      // アクションフェイズへ
      G.phase = 'action';
      enableActions(true);
      updateUI();
    }

    // ── アクション実行 ──
    function doAction(type) {
      let n = 0;
      let msg = '';
      const who = pname(currentPlayerIdx());

      if (type === 'fish') {
        n = FoodAction.fish();
        G.food += n;
        msg = who + ' が釣りをして 食料 +' + n;
      } else if (type === 'water') {
        n = WaterAction.collect();
        G.water += n;
        msg = who + ' が水を汲んで 水 +' + n + (n === 0 ? ' (雨なし)' : '');
      } else if (type === 'log') {
        n = RaftAction.cut();
        G.raft += n;
        msg = who + ' が伐採して いかだ材 +' + n;
      }

      addLog(msg);

      // 勝利チェック
      if (G.food >= PLAYERS && G.water >= PLAYERS && G.raft >= PLAYERS) {
        updateUI();
        endGame(true);
        return;
      }

      // 次のターンへ
      G.turnIndex++;

      if (G.turnIndex >= PLAYERS) {
        // ラウンド終了処理
        G.food  -= PLAYERS;
        G.water -= PLAYERS;
        addLog(
          '── ラウンド ' + G.round + ' 終了: 食料 -' + PLAYERS + '、水 -' + PLAYERS + ' ──',
          'round-end'
        );
        G.round++;

        if (G.food < 0 || G.water < 0) {
          updateUI();
          endGame(false);
          return;
        }

        // 次ラウンドの準備
        Leader.rotate();
        G.turnOrder  = Leader.turnOrder();
        G.turnIndex  = 0;
        G.phase      = 'weather';
        Weather.current = null;

        document.getElementById('weather-icon').textContent = '──';
        document.getElementById('weather-desc').textContent = 'リーダーがカードをめくってください';
        document.getElementById('water-hint').textContent   = '雨量: ?';
        document.getElementById('flip-btn').disabled = false;
        enableActions(false);
      }

      updateUI();
    }

    function enableActions(on) {
      ['btn-fish', 'btn-water', 'btn-log'].forEach(id => {
        document.getElementById(id).disabled = !on;
      });
    }

    // ── UI更新 ──
    function updateUI() {
      const setVal = (id, v) => {
        const el = document.getElementById(id);
        el.textContent = v;
        el.className = 'value' + (v < 0 ? ' danger' : v >= PLAYERS ? ' ok' : '');
      };
      setVal('food',  G.food);
      setVal('water', G.water);
      setVal('raft',  G.raft);
      document.getElementById('round').textContent = G.round;

      // リーダーバッジ
      for (let i = 0; i < PLAYERS; i++) {
        document.getElementById('badge-' + i).textContent =
          i === Leader.current ? '👑 リーダー' : '';
      }

      // アクティブプレイヤー
      const activePIdx = G.phase === 'action' ? currentPlayerIdx() : Leader.current;
      document.querySelectorAll('.player-card').forEach((el, i) => {
        el.classList.toggle('active', i === activePIdx);
      });

      // フェイズメッセージ
      const msgEl = document.getElementById('phase-msg');
      if (G.phase === 'weather') {
        msgEl.textContent = Leader.name() + ' が天候カードをめくるのを待っています';
      } else {
        msgEl.textContent = pname(currentPlayerIdx()) + ' のターン';
      }

      // flip ボタン: 天候フェイズかつリーダーのみ有効
      document.getElementById('flip-btn').disabled =
        G.phase !== 'weather' || Weather.current !== null;
    }

    // ── ゲーム終了 ──
    function endGame(won) {
      G.phase = 'ended';
      enableActions(false);
      document.getElementById('overlay').style.display = 'flex';
      document.getElementById('ov-title').textContent = won ? '🎉 脱出成功！' : '💀 力尽きた…';
      document.getElementById('ov-msg').textContent = won
        ? 'ラウンド ' + (G.round - 1) + ' で全員分の資源を揃えて脱出しました！'
        : 'ラウンド ' + (G.round - 1) + ' で食料か水が底をつきました。';
    }

    // ── ログ追記 ──
    function addLog(msg, cls) {
      const log = document.getElementById('log');
      const div = document.createElement('div');
      div.className = 'log-entry' + (cls ? ' ' + cls : '');
      div.textContent = msg;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    // ── リスタート ──
    function restartGame() {
      Object.assign(G, {
        food: 0, water: 0, raft: 0,
        round: 1, phase: 'weather', turnIndex: 0,
      });
      Leader.init(PLAYERS);
      Weather.init();
      G.turnOrder = Leader.turnOrder();

      document.getElementById('overlay').style.display = 'none';
      document.getElementById('flip-btn').disabled = false;
      document.getElementById('weather-icon').textContent = '──';
      document.getElementById('weather-desc').textContent = 'リーダーがカードをめくってください';
      document.getElementById('water-hint').textContent   = '雨量: ?';
      document.getElementById('log').innerHTML =
        '<div class="log-entry">ゲーム開始！ 3人で力を合わせて脱出しよう。</div>';
      enableActions(false);
      updateUI();
      addLog(Leader.name() + ' がリーダーに選ばれた！');
    }

    // ── 初期化 ──
    Leader.init(PLAYERS);
    Weather.init();
    G.turnOrder = Leader.turnOrder();
    updateUI();
    addLog(Leader.name() + ' がリーダーに選ばれた！');
  </script>
</body>
</html>
